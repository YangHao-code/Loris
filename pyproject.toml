[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loris"
version = "0.4.0"
description = "Logic-Reinforced Adaptive Document Labeling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.3",
    "scipy>=1.9",
]

[project.scripts]
loris-discover = "loris.discovery.__main__:main"
loris-experiments = "loris.experiments.__main__:main"
loris-label = "loris.labeling.__main__:main"

[project.optional-dependencies]
aligned = ["torch>=1.11", "optuna>=4.5"]
torch = ["torch>=1.11", "transformers>=4.40", "pandas>=1.3", "peft>=0.10", "bitsandbytes>=0.43", "xgboost>=1.7"]
embed = ["sentence-transformers", "spacy>=3.7"]
dev = ["pytest>=7.0"]
report = ["matplotlib>=3.5"]
datasets = ["pyarrow>=10"]

[tool.setuptools.package-dir]
loris_ssl = "backends/transformer/src/loris_ssl"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.setuptools.packages.find]
where = [".", "backends/transformer/src"]
include = ["loris*", "loris_ssl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "golden: golden-master characterization tests (slow, require artifacts)",
    "integration: end-to-end pipeline tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
