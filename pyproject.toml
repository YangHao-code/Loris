[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loris"
version = "0.2.0"
description = "Logic-Reinforced Inference for Semantic labeling — rule-based multi-label document classification"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.3",
    "scipy>=1.8",
]

[project.optional-dependencies]
torch = ["torch>=1.11", "transformers>=4.40", "peft>=0.10", "bitsandbytes>=0.43", "xgboost>=1.7"]
embed = ["sentence-transformers", "spacy>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["loris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "golden: golden-master characterization tests (slow, require artifacts)",
    "integration: end-to-end pipeline tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
